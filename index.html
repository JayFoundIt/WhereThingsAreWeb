<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jay: Where Things Are</title>
<meta name="description" content="Jay remembers where your things are. Say it once, find it later. Coming soon.">
<meta name="theme-color" content="#EAF2FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1730" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://wherethingsare.at/">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wherethingsare.at/">
<meta property="og:title" content="Jay: Where Things Are">
<meta property="og:description" content="Say it once. Find it later.">
<meta property="og:image" content="https://wherethingsare.at/icon-512.png">
<meta name="twitter:card" content="summary">
<style>
  :root {
    color-scheme: light dark;
    --jay: #1C6EE8;
    --jay-deep: #0F4AB8;
    --acorn: #B4682B;
    --ink: #0E1B33;
    --soft: #4A5A78;
    --sky-top: #D6E7FF;
    --sky-mid: #EAF2FF;
    --sky-low: #FBF4EA;
    --pill: rgba(255, 255, 255, 0.72);
    --pill-edge: rgba(28, 110, 232, 0.16);
    --glow: rgba(28, 110, 232, 0.30);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --jay: #6EA8FF;
      --jay-deep: #9CC3FF;
      --acorn: #E0A062;
      --ink: #F2F6FF;
      --soft: #A9B8D6;
      --sky-top: #0B1730;
      --sky-mid: #0F2147;
      --sky-low: #1B1A22;
      --pill: rgba(255, 255, 255, 0.08);
      --pill-edge: rgba(255, 255, 255, 0.14);
      --glow: rgba(60, 130, 255, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 100%) fixed;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* Two soft clouds of colour behind everything. */
  body::before, body::after {
    content: "";
    position: fixed;
    width: 60vmax; height: 60vmax;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  body::before { background: radial-gradient(circle, rgba(28, 110, 232, 0.35), transparent 65%); top: -25vmax; right: -20vmax; }
  body::after { background: radial-gradient(circle, rgba(224, 150, 80, 0.30), transparent 65%); bottom: -30vmax; left: -22vmax; }

  main {
    position: relative;
    z-index: 1;
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
    gap: 0;
  }
  .icon {
    width: clamp(132px, 34vw, 184px);
    height: auto;
    aspect-ratio: 1;
    border-radius: 22.5%;
    box-shadow: 0 24px 60px -18px var(--glow), 0 6px 18px -8px rgba(14, 27, 51, 0.35);
    animation: bob 5s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-10px) rotate(1.5deg); }
  }
  @media (prefers-reduced-motion: reduce) { .icon { animation: none; } }

  .name {
    margin: 30px 0 0;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--jay);
  }
  h1 {
    margin: 8px 0 0;
    font-size: clamp(2.4rem, 9vw, 4.2rem);
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .slogan {
    margin: 18px 0 0;
    font-size: clamp(1.15rem, 3.6vw, 1.45rem);
    font-weight: 500;
    color: var(--soft);
    text-wrap: balance;
  }
  .soon {
    margin-top: 34px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px 10px 14px;
    border-radius: 999px;
    background: var(--pill);
    border: 1px solid var(--pill-edge);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    font-size: 0.98rem;
    font-weight: 600;
    color: var(--jay-deep);
  }
  .soon::before {
    content: "";
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--acorn);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--acorn) 22%, transparent);
  }
</style>
</head>
<body>
<main>
  <img class="icon" src="/icon-512.png" width="512" height="512" alt="Jay, a blue jay holding an acorn">
  <p class="name">Jay</p>
  <h1>Where Things Are</h1>
  <p class="slogan" data-de="Einmal sagen. Später finden.">Say it once. Find it later.</p>
  <p class="soon" data-de="Bald da">Coming soon</p>
</main>
<script>
  // German visitors get the German lines; the name stays as it is.
  if ((navigator.language || "").toLowerCase().startsWith("de")) {
    document.documentElement.lang = "de";
    document.querySelectorAll("[data-de]").forEach(function (el) { el.textContent = el.dataset.de; });
  }
</script>
</body>
</html>
